<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <radialGradient id="tBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0e0a1f"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </radialGradient>
    <radialGradient id="tAmbient" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="tGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tSoftGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tPathGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
    </filter>
    <linearGradient id="tLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#6d28d9" stop-opacity="0.4"/>
      <stop offset="50%"  stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="tRightFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#060d1a" stop-opacity="0"/>
      <stop offset="55%"  stop-color="#060d1a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#060d1a" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="280" fill="url(#tBg)"/>
  <rect width="800" height="280" fill="url(#tAmbient)"/>

  <!-- ── PATH: 5 nodes ascending from bottom-left to upper-right ── -->
  <!-- m1(100,220) → m2(195,170) → m3(290,128) → m4(385,88) → m5(480,50) -->

  <!-- Path glow layer -->
  <path d="M100,220 C130,205 165,185 195,170 C225,155 260,143 290,128 C320,113 350,102 385,88 C415,75 448,65 480,50"
        fill="none" stroke="#a78bfa" stroke-width="10" stroke-linecap="round"
        stroke-opacity="0.15" filter="url(#tPathGlow)"/>

  <!-- Main path line -->
  <path d="M100,220 C130,205 165,185 195,170 C225,155 260,143 290,128 C320,113 350,102 385,88 C415,75 448,65 480,50"
        fill="none" stroke="url(#tLine)" stroke-width="2" stroke-linecap="round"/>

  <!-- Branch lines from m1 -->
  <line x1="100" y1="220" x2="55"  y2="190" stroke="#6d28d9" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="100" y1="220" x2="60"  y2="248" stroke="#6d28d9" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- Branch from m3 (choice point) -->
  <line x1="290" y1="128" x2="265" y2="88"  stroke="#7c3aed" stroke-opacity="0.28" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="290" y1="128" x2="320" y2="162" stroke="#7c3aed" stroke-opacity="0.22" stroke-width="1"   stroke-dasharray="3 4"/>

  <!-- Orbit lines around m5 (achievement) -->
  <line x1="480" y1="50" x2="520" y2="28"   stroke="#c4b5fd" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="480" y1="50" x2="518" y2="72"   stroke="#c4b5fd" stroke-opacity="0.3"  stroke-width="1"   stroke-dasharray="3 4"/>

  <!-- ── NODES ── -->

  <!-- m1 — Start (small) -->
  <circle cx="100" cy="220" r="14" fill="#6d28d9" fill-opacity="0.1" filter="url(#tSoftGlow)"/>
  <circle cx="100" cy="220" r="6"  fill="#7c3aed" fill-opacity="0.75" filter="url(#tSoftGlow)"/>
  <circle cx="100" cy="220" r="2.5" fill="#ffffff" fill-opacity="0.7"/>

  <!-- Branch nodes from m1 -->
  <circle cx="55"  cy="190" r="3.5" fill="#6d28d9" fill-opacity="0.6" filter="url(#tSoftGlow)"/>
  <circle cx="55"  cy="190" r="1.5" fill="#ffffff"  fill-opacity="0.5"/>
  <circle cx="60"  cy="248" r="3"   fill="#6d28d9" fill-opacity="0.5" filter="url(#tSoftGlow)"/>
  <circle cx="60"  cy="248" r="1.5" fill="#ffffff"  fill-opacity="0.4"/>

  <!-- m2 -->
  <circle cx="195" cy="170" r="15" fill="#7c3aed" fill-opacity="0.1" filter="url(#tSoftGlow)"/>
  <circle cx="195" cy="170" r="7"  fill="#8b5cf6" fill-opacity="0.8" filter="url(#tSoftGlow)"/>
  <circle cx="195" cy="170" r="3"  fill="#ffffff"  fill-opacity="0.8"/>

  <!-- m3 — Choice node -->
  <circle cx="290" cy="128" r="16" fill="#8b5cf6" fill-opacity="0.12" filter="url(#tSoftGlow)"/>
  <circle cx="290" cy="128" r="8"  fill="#9333ea" fill-opacity="0.82" filter="url(#tSoftGlow)"/>
  <circle cx="290" cy="128" r="3.5" fill="#ffffff" fill-opacity="0.85"/>

  <!-- Branch nodes from m3 -->
  <circle cx="265" cy="88"  r="4"  fill="#7c3aed" fill-opacity="0.6" filter="url(#tSoftGlow)"/>
  <circle cx="265" cy="88"  r="2"  fill="#ffffff"  fill-opacity="0.55"/>
  <circle cx="320" cy="162" r="3.5" fill="#7c3aed" fill-opacity="0.5" filter="url(#tSoftGlow)"/>
  <circle cx="320" cy="162" r="1.5" fill="#ffffff"  fill-opacity="0.45"/>

  <!-- m4 -->
  <circle cx="385" cy="88"  r="17" fill="#9333ea" fill-opacity="0.12" filter="url(#tGlow)"/>
  <circle cx="385" cy="88"  r="8"  fill="#a855f7" fill-opacity="0.85" filter="url(#tGlow)"/>
  <circle cx="385" cy="88"  r="3.5" fill="#ffffff" fill-opacity="0.88"/>

  <!-- m5 — Goal (largest, brightest) -->
  <circle cx="480" cy="50"  r="22" fill="#a78bfa" fill-opacity="0.12" filter="url(#tGlow)"/>
  <circle cx="480" cy="50"  r="10" fill="#a78bfa" fill-opacity="0.9"  filter="url(#tGlow)"/>
  <circle cx="480" cy="50"  r="4.5" fill="#ffffff" fill-opacity="0.95"/>

  <!-- Orbit nodes from m5 -->
  <circle cx="520" cy="28"  r="5"  fill="#c4b5fd" fill-opacity="0.75" filter="url(#tSoftGlow)"/>
  <circle cx="520" cy="28"  r="2"  fill="#ffffff"  fill-opacity="0.8"/>
  <circle cx="518" cy="72"  r="4"  fill="#c4b5fd" fill-opacity="0.65" filter="url(#tSoftGlow)"/>
  <circle cx="518" cy="72"  r="2"  fill="#ffffff"  fill-opacity="0.7"/>

  <!-- Scattered ambient nodes -->
  <circle cx="40"  cy="120" r="1.8" fill="#a78bfa" fill-opacity="0.2"/>
  <circle cx="420" cy="200" r="1.8" fill="#a78bfa" fill-opacity="0.15"/>
  <circle cx="145" cy="50"  r="1.5" fill="#a78bfa" fill-opacity="0.18"/>
  <circle cx="450" cy="220" r="1.5" fill="#a78bfa" fill-opacity="0.12"/>
  <circle cx="360" cy="240" r="1.5" fill="#a78bfa" fill-opacity="0.12"/>

  <!-- Right fade -->
  <rect width="800" height="280" fill="url(#tRightFade)"/>
</svg>
