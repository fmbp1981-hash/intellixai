<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <radialGradient id="rBg" cx="30%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d2236"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </radialGradient>
    <radialGradient id="rGlow" cx="28%" cy="52%" r="38%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rBlip1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rClip">
      <rect width="800" height="280"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="280" fill="url(#rBg)"/>
  <rect width="800" height="280" fill="url(#rGlow)"/>

  <!-- Subtle grid -->
  <g stroke="#22d3ee" stroke-opacity="0.05" stroke-width="1" clip-path="url(#rClip)">
    <line x1="0" y1="70" x2="800" y2="70"/>
    <line x1="0" y1="140" x2="800" y2="140"/>
    <line x1="0" y1="210" x2="800" y2="210"/>
    <line x1="133" y1="0" x2="133" y2="280"/>
    <line x1="266" y1="0" x2="266" y2="280"/>
    <line x1="399" y1="0" x2="399" y2="280"/>
    <line x1="532" y1="0" x2="532" y2="280"/>
    <line x1="665" y1="0" x2="665" y2="280"/>
  </g>

  <!-- Radar rings from center 210,140 -->
  <g fill="none" clip-path="url(#rClip)">
    <circle cx="210" cy="140" r="45"  stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.2"/>
    <circle cx="210" cy="140" r="88"  stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="210" cy="140" r="132" stroke="#22d3ee" stroke-opacity="0.2"  stroke-width="1"/>
    <circle cx="210" cy="140" r="175" stroke="#22d3ee" stroke-opacity="0.1"  stroke-width="0.8"/>
    <circle cx="210" cy="140" r="220" stroke="#22d3ee" stroke-opacity="0.05" stroke-width="0.5"/>
  </g>

  <!-- Crosshair lines -->
  <line x1="210" y1="0"   x2="210" y2="280" stroke="#22d3ee" stroke-opacity="0.1" stroke-width="0.6"/>
  <line x1="0"   y1="140" x2="430" y2="140" stroke="#22d3ee" stroke-opacity="0.1" stroke-width="0.6"/>

  <!-- Sweep wedge (static, pointing to ~45deg) -->
  <path d="M210,140 L335,22 A148,148 0 0,1 358,140 Z" fill="#22d3ee" fill-opacity="0.05" clip-path="url(#rClip)"/>
  <line x1="210" y1="140" x2="335" y2="22" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="1.5" clip-path="url(#rClip)"/>

  <!-- Center dot -->
  <circle cx="210" cy="140" r="5"  fill="#22d3ee" fill-opacity="0.9"/>
  <circle cx="210" cy="140" r="12" fill="#22d3ee" fill-opacity="0.15"/>

  <!-- Blip 1 (strong — near sweep tip) -->
  <circle cx="291" cy="72"  r="5"  fill="#22d3ee" fill-opacity="0.95"/>
  <circle cx="291" cy="72"  r="12" fill="#22d3ee" fill-opacity="0.2"/>
  <circle cx="291" cy="72"  r="20" fill="#22d3ee" fill-opacity="0.07"/>

  <!-- Blip 2 -->
  <circle cx="155" cy="72"  r="3.5" fill="#22d3ee" fill-opacity="0.6"/>
  <circle cx="155" cy="72"  r="9"   fill="#22d3ee" fill-opacity="0.12"/>

  <!-- Blip 3 -->
  <circle cx="320" cy="168" r="3"   fill="#22d3ee" fill-opacity="0.45"/>
  <circle cx="320" cy="168" r="8"   fill="#22d3ee" fill-opacity="0.1"/>

  <!-- Blip 4 (faint) -->
  <circle cx="182" cy="192" r="2.5" fill="#22d3ee" fill-opacity="0.3"/>

  <!-- Divider -->
  <line x1="455" y1="25" x2="455" y2="255" stroke="#22d3ee" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Right panel: DATA READOUT -->
  <g font-family="'Courier New', monospace">
    <!-- Label -->
    <text x="490" y="55"  font-size="10" fill="#22d3ee" fill-opacity="0.38" letter-spacing="2">DIAGNÓSTICO ESTRATÉGICO</text>
    <line x1="490" y1="62" x2="770" y2="62" stroke="#22d3ee" stroke-opacity="0.12" stroke-width="1"/>

    <!-- Score -->
    <text x="490" y="100" font-size="11" fill="#22d3ee" fill-opacity="0.35" letter-spacing="1">OPORTUNIDADES</text>
    <text x="490" y="128" font-size="48" font-weight="bold" fill="#22d3ee" fill-opacity="0.85">06</text>
    <text x="554" y="120" font-size="11" fill="#22d3ee" fill-opacity="0.4">identificadas</text>

    <!-- Bars -->
    <text x="490" y="162" font-size="9" fill="#22d3ee" fill-opacity="0.3" letter-spacing="1">ROI POR INICIATIVA</text>

    <!-- Bar 1 -->
    <rect x="490" y="170" width="200" height="6" rx="3" fill="#0a2030"/>
    <rect x="490" y="170" width="160" height="6" rx="3" fill="#22d3ee" fill-opacity="0.65"/>
    <text x="658" y="178" font-size="9" fill="#22d3ee" fill-opacity="0.55">+3.2×</text>

    <!-- Bar 2 -->
    <rect x="490" y="184" width="200" height="6" rx="3" fill="#0a2030"/>
    <rect x="490" y="184" width="112" height="6" rx="3" fill="#22d3ee" fill-opacity="0.45"/>
    <text x="658" y="192" font-size="9" fill="#22d3ee" fill-opacity="0.4">+1.8×</text>

    <!-- Bar 3 -->
    <rect x="490" y="198" width="200" height="6" rx="3" fill="#0a2030"/>
    <rect x="490" y="198" width="185" height="6" rx="3" fill="#22d3ee" fill-opacity="0.35"/>
    <text x="682" y="206" font-size="9" fill="#22d3ee" fill-opacity="0.35">+4.5×</text>

    <line x1="490" y1="228" x2="770" y2="228" stroke="#22d3ee" stroke-opacity="0.08" stroke-width="1"/>
    <text x="490" y="248" font-size="9" fill="#22d3ee" fill-opacity="0.22" letter-spacing="2">ANTES DE GASTAR UM CENTAVO</text>
  </g>

  <!-- Corner glow -->
  <radialGradient id="rCorner" cx="0%" cy="0%" r="100%">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <rect width="300" height="200" fill="url(#rCorner)"/>
</svg>
