<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <radialGradient id="bg" cx="35%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#071828"/>
      <stop offset="100%" stop-color="#060d1a"/>
    </radialGradient>
    <radialGradient id="ambientGlow" cx="35%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sweepGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="280" fill="url(#bg)"/>
  <rect width="800" height="280" fill="url(#ambientGlow)"/>

  <!-- Radar rings (strokes, faint) centered at 240,140 -->
  <circle cx="240" cy="140" r="55"  fill="none" stroke="#22d3ee" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="240" cy="140" r="105" fill="none" stroke="#22d3ee" stroke-opacity="0.11" stroke-width="1"/>
  <circle cx="240" cy="140" r="158" fill="none" stroke="#22d3ee" stroke-opacity="0.07" stroke-width="0.8"/>
  <circle cx="240" cy="140" r="205" fill="none" stroke="#22d3ee" stroke-opacity="0.04" stroke-width="0.6"/>

  <!-- Crosshairs -->
  <line x1="240" y1="0"   x2="240" y2="280" stroke="#22d3ee" stroke-opacity="0.07" stroke-width="0.6"/>
  <line x1="20"  y1="140" x2="460" y2="140" stroke="#22d3ee" stroke-opacity="0.07" stroke-width="0.6"/>

  <!-- Sweep wedge glow layer -->
  <path d="M240,140 L388,9 A165,165 0 0,1 398,140 Z" fill="#22d3ee" filter="url(#sweepGlow)" opacity="0.25"/>

  <!-- Sweep wedge solid -->
  <path d="M240,140 L388,9 A165,165 0 0,1 398,140 Z" fill="#22d3ee" fill-opacity="0.06"/>
  <line x1="240" y1="140" x2="388" y2="9" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5" filter="url(#softGlow)"/>

  <!-- Signal return lines (center → blips) -->
  <line x1="240" y1="140" x2="330" y2="50"  stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 5"/>
  <line x1="240" y1="140" x2="368" y2="118" stroke="#22d3ee" stroke-opacity="0.2"  stroke-width="1" stroke-dasharray="4 5"/>
  <line x1="240" y1="140" x2="175" y2="55"  stroke="#22d3ee" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4 5"/>
  <line x1="240" y1="140" x2="105" y2="90"  stroke="#22d3ee" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- ── NODES ── -->

  <!-- Center origin (bright) -->
  <circle cx="240" cy="140" r="14" fill="#22d3ee" fill-opacity="0.1" filter="url(#glow)"/>
  <circle cx="240" cy="140" r="6"  fill="#22d3ee" fill-opacity="0.9" filter="url(#glow)"/>
  <circle cx="240" cy="140" r="3"  fill="#ffffff" fill-opacity="0.95"/>

  <!-- Blip 1 — strong, near sweep tip -->
  <circle cx="330" cy="50"  r="18" fill="#22d3ee" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="330" cy="50"  r="7"  fill="#22d3ee" fill-opacity="0.85" filter="url(#glow)"/>
  <circle cx="330" cy="50"  r="3"  fill="#ffffff" fill-opacity="0.9"/>

  <!-- Blip 2 -->
  <circle cx="368" cy="118" r="12" fill="#22d3ee" fill-opacity="0.07" filter="url(#softGlow)"/>
  <circle cx="368" cy="118" r="5"  fill="#22d3ee" fill-opacity="0.75" filter="url(#softGlow)"/>
  <circle cx="368" cy="118" r="2"  fill="#ffffff" fill-opacity="0.8"/>

  <!-- Blip 3 (upper-left) -->
  <circle cx="175" cy="55"  r="10" fill="#22d3ee" fill-opacity="0.06" filter="url(#softGlow)"/>
  <circle cx="175" cy="55"  r="4"  fill="#22d3ee" fill-opacity="0.55" filter="url(#softGlow)"/>
  <circle cx="175" cy="55"  r="2"  fill="#ffffff" fill-opacity="0.6"/>

  <!-- Blip 4 (faint) -->
  <circle cx="105" cy="90"  r="4"  fill="#22d3ee" fill-opacity="0.45" filter="url(#softGlow)"/>
  <circle cx="105" cy="90"  r="2"  fill="#ffffff" fill-opacity="0.5"/>

  <!-- Inner ring node markers (on the 55r ring) -->
  <circle cx="295" cy="140" r="3"  fill="#22d3ee" fill-opacity="0.5"/>
  <circle cx="240" cy="85"  r="3"  fill="#22d3ee" fill-opacity="0.5"/>
  <circle cx="185" cy="140" r="3"  fill="#22d3ee" fill-opacity="0.4"/>
  <circle cx="240" cy="195" r="3"  fill="#22d3ee" fill-opacity="0.4"/>

  <!-- Mid ring node markers (on the 105r ring) -->
  <circle cx="345" cy="140" r="2.5" fill="#22d3ee" fill-opacity="0.35"/>
  <circle cx="240" cy="35"  r="2.5" fill="#22d3ee" fill-opacity="0.35"/>
  <circle cx="135" cy="140" r="2.5" fill="#22d3ee" fill-opacity="0.3"/>
  <circle cx="240" cy="245" r="2.5" fill="#22d3ee" fill-opacity="0.3"/>

  <!-- Subtle background nodes (scattered) -->
  <circle cx="60"  cy="40"  r="1.5" fill="#22d3ee" fill-opacity="0.2"/>
  <circle cx="420" cy="220" r="1.5" fill="#22d3ee" fill-opacity="0.15"/>
  <circle cx="30"  cy="200" r="1.5" fill="#22d3ee" fill-opacity="0.18"/>
  <circle cx="410" cy="40"  r="1.5" fill="#22d3ee" fill-opacity="0.12"/>
  <circle cx="450" cy="170" r="1.5" fill="#22d3ee" fill-opacity="0.12"/>

  <!-- Right side fade (gradient from transparent to site bg) -->
  <defs>
    <linearGradient id="rightFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#060d1a" stop-opacity="0"/>
      <stop offset="55%"  stop-color="#060d1a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#060d1a" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="800" height="280" fill="url(#rightFade)"/>
</svg>
